# docs/design/registry.yaml — every screen and shared component, by DS- ID.
# Plans, commits, mocks and board files use the ID (tickets don't). kind: foundation | component | screen
# status: draft (mock drawn) | approved (confirmed on the board) | implemented | deprecated (never delete an entry)
# ID shape: DS-web2-<name>
# An entry with `mock: none` is listed (list approved by the user on 2026-11-18) but not drawn yet.
designs:
  # Flag dashboard (admin)
  - id: DS-web2-login
    kind: screen
    name: Autentificare
    app: dashboard
    status: implemented   # dashboard/login.html + src/login.js, 2026-11-26 (mock confirmed the same day)
    mock: docs/design/mocks/DS-web2-login.html
  - id: DS-web2-flags
    kind: screen
    name: Lista flag-urilor
    app: dashboard
    status: implemented   # dashboard/index.html + src/app.js, 2026-11-26; mock re-confirmed 2026-11-18 and 2026-11-26. Not built yet (hidden): create, search, filter, descriptions, tags, badges, results, archive, other nav links
    mock: docs/design/mocks/DS-web2-flags.html
  - id: DS-web2-flag-detail
    kind: screen
    name: Detaliul unui flag
    app: dashboard
    status: draft
    mock: none
  - id: DS-web2-experiment
    kind: screen
    name: Rezultatele experimentului
    app: dashboard
    status: implemented   # dashboard/experiment.html + src/experiment.js, src/results.js, 2026-11-26; mock confirmed the same day ("utilizatori expuși" everywhere). Not built: the "Rezultate" button on a flags row
    mock: docs/design/mocks/DS-web2-experiment.html
  - id: DS-web2-audit
    kind: screen
    name: Jurnal de audit
    app: dashboard
    status: draft
    mock: none
  - id: DS-web2-settings
    kind: screen
    name: Proiect și medii
    app: dashboard
    status: draft
    mock: none
  # P1 (colegii de grupă)
  - id: DS-web2-parking
    kind: screen
    name: Parcarea
    app: p1
    status: implemented   # p1/, 2026-11-25; mock re-confirmed the same day (error state dropped, Q-035; no ramp hint)
    mock: docs/design/mocks/DS-web2-parking.html
