# Local stack (D-002, D-007): PostgreSQL + the Express server.
# POSTGRES_PASSWORD comes from .env (see .env.example); never commit it.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: web2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h: over TCP, so it fails while the first-start init server listens only on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d web2"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/web2
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"  # local only until hosting is decided (Q-005)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
